<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200" role="img" aria-label="How it works: the Shortcut posts artist names to /ingest, they are matched on MusicBrainz, and Lidarr reads /list">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfbfc"/><stop offset="1" stop-color="#f3f6f4"/></linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#e8274a"/><stop offset="0.5" stop-color="#c77700"/><stop offset="1" stop-color="#0b9f5b"/>
      <animate attributeName="x1" values="0%;-40%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8274a"/><stop offset="1" stop-color="#0b9f5b"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="clip"><rect width="840" height="200" rx="16"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1a1020" fill-opacity="0.045"/></pattern>
  </defs>
  <rect width="840" height="200" rx="16" fill="url(#bg)"/>
  <rect width="840" height="200" rx="16" fill="url(#dots)"/>
  <path d="M 105 62 L 735 62" stroke="#d9d2dc" stroke-width="2"/>
  <path d="M 105 62 L 735 62" stroke="url(#flow)" stroke-width="2" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
  <circle r="5" fill="#c77700"><animateMotion path="M 105 62 L 735 62" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="62" r="24" fill="#ffffff" stroke="#e8274a" stroke-width="2.5"/>
  <text x="105" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#e8274a">1</text>
  <text x="105" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18141f">Shortcut reads</text>
  <text x="105" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#18141f">your library</text>
  <text x="105" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5e5869">on the iPhone, nightly</text>
  <circle cx="315" cy="62" r="24" fill="#ffffff" stroke="#d81b3c" stroke-width="2.5"/>
  <text x="315" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#d81b3c">2</text>
  <text x="315" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18141f">POST /ingest</text>
  <text x="315" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#18141f">artist names</text>
  <text x="315" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5e5869">+ that person's token</text>
  <circle cx="525" cy="62" r="24" fill="#ffffff" stroke="#c77700" stroke-width="2.5"/>
  <text x="525" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#c77700">3</text>
  <text x="525" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18141f">MusicBrainz</text>
  <text x="525" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#18141f">name → artist ID</text>
  <text x="525" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5e5869">cached, ~1 lookup/sec</text>
  <circle cx="735" cy="62" r="24" fill="#ffffff" stroke="#0b9f5b" stroke-width="2.5"/>
  <text x="735" y="69" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#0b9f5b">4</text>
  <text x="735" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18141f">GET /list</text>
  <text x="735" y="139" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#18141f">Custom List</text>
  <text x="735" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#5e5869">Lidarr adds the artists</text>
</svg>
