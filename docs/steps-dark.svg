<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-label="How it works: the Shortcut posts artist names to /ingest, they are matched on MusicBrainz, and Lidarr reads /list">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0a10"/><stop offset="1" stop-color="#12101a"/></linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#ff4f6d"/><stop offset="0.5" stop-color="#ffb547"/><stop offset="1" stop-color="#1fd17f"/>
      <animate attributeName="x1" values="0%;-40%;0%" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;140%;100%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4f6d"/><stop offset="1" stop-color="#1fd17f"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="clip"><rect width="840" height="250" rx="16"/></clipPath>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.035"/></pattern>
  </defs>
  <rect width="840" height="250" rx="16" fill="url(#bg)"/>
  <rect width="840" height="250" rx="16" fill="url(#dots)"/>
  <path d="M 105 66 L 735 66" stroke="#3a3448" stroke-width="2"/>
  <path d="M 105 66 L 735 66" stroke="url(#flow)" stroke-width="2" stroke-dasharray="4 8"><animate attributeName="stroke-dashoffset" values="24;0" dur="1s" repeatCount="indefinite"/></path>
  <circle r="5" fill="#ffb547"><animateMotion path="M 105 66 L 735 66" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="66" r="30" fill="#1b1824" stroke="#ff4f6d" stroke-width="3"/>
  <text x="105" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#ff4f6d">1</text>
  <text x="105" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2f7">Shortcut reads</text>
  <text x="105" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4f2f7">your library</text>
  <text x="105" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#a8a3b3">on iPhone, nightly</text>
  <circle cx="315" cy="66" r="30" fill="#1b1824" stroke="#fa2d48" stroke-width="3"/>
  <text x="315" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#fa2d48">2</text>
  <text x="315" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2f7">POST /ingest</text>
  <text x="315" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4f2f7">artist names</text>
  <text x="315" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#a8a3b3">+ person's token</text>
  <circle cx="525" cy="66" r="30" fill="#1b1824" stroke="#ffb547" stroke-width="3"/>
  <text x="525" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#ffb547">3</text>
  <text x="525" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2f7">MusicBrainz</text>
  <text x="525" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4f2f7">name → artist ID</text>
  <text x="525" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#a8a3b3">cached, ~1/sec</text>
  <circle cx="735" cy="66" r="30" fill="#1b1824" stroke="#1fd17f" stroke-width="3"/>
  <text x="735" y="75" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#1fd17f">4</text>
  <text x="735" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#f4f2f7">GET /list</text>
  <text x="735" y="168" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f4f2f7">Custom List</text>
  <text x="735" y="196" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace" font-size="17" fill="#a8a3b3">Lidarr adds artists</text>
</svg>
