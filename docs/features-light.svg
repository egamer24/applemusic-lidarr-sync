<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-label="Features: no Apple login, whole household, admin with 2FA, reports, forgiving matching, tiny">
<rect width="840" height="330" fill="none"/>
  <g>
    <rect x="12" y="16" width="264" height="142" rx="14" fill="#ffffff" stroke="#e4dee6"/>
    <rect x="12" y="16" width="264" height="3" rx="1.5" fill="#e8274a" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4.0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="50" cy="58" r="22" fill="#e8274a" opacity="0.13"/>
    <g transform="translate(50 58)" fill="#e8274a" stroke="#e8274a" stroke-width="0"><rect x="-11" y="-2" width="22" height="16" rx="3"/><path d="M -6 -2 V -8 A 6 6 0 0 1 6 -8 V -2" fill="none" stroke-width="2.4"/></g>
    <text x="84" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18141f">No Apple login</text>
    <text x="32" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">The phone sends artist names.</text><text x="32" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">Nothing signs in to your Apple ID.</text>
  </g><g>
    <rect x="288" y="16" width="264" height="142" rx="14" fill="#ffffff" stroke="#e4dee6"/>
    <rect x="288" y="16" width="264" height="3" rx="1.5" fill="#c77700" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4.6s" repeatCount="indefinite"/>
    </rect>
    <circle cx="326" cy="58" r="22" fill="#c77700" opacity="0.13"/>
    <g transform="translate(326 58)" fill="#c77700" stroke="#c77700" stroke-width="0"><circle cx="-6" cy="-6" r="5"/><circle cx="7" cy="-4" r="4"/><path d="M -15 12 A 9 9 0 0 1 3 12 Z"/><path d="M 0 12 A 7 7 0 0 1 14 12 Z" opacity="0.6"/></g>
    <text x="360" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18141f">The whole household</text>
    <text x="308" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">A token per person, one combined</text><text x="308" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">Lidarr list, each artist once.</text>
  </g><g>
    <rect x="564" y="16" width="264" height="142" rx="14" fill="#ffffff" stroke="#e4dee6"/>
    <rect x="564" y="16" width="264" height="3" rx="1.5" fill="#0b9f5b" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="5.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="602" cy="58" r="22" fill="#0b9f5b" opacity="0.13"/>
    <g transform="translate(602 58)" fill="#0b9f5b" stroke="#0b9f5b" stroke-width="0"><path d="M 0 -14 L 12 -9 V 0 C 12 8 6 13 0 15 C -6 13 -12 8 -12 0 V -9 Z"/><path d="M -5 0 L -1 4 L 6 -4" fill="none" stroke-width="2.6"/></g>
    <text x="636" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18141f">Admin with 2FA</text>
    <text x="584" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">First-run setup, password,</text><text x="584" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">authenticator codes, lockout.</text>
  </g><g>
    <rect x="12" y="172" width="264" height="142" rx="14" fill="#ffffff" stroke="#e4dee6"/>
    <rect x="12" y="172" width="264" height="3" rx="1.5" fill="#e8274a" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="5.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="50" cy="214" r="22" fill="#e8274a" opacity="0.13"/>
    <g transform="translate(50 214)" fill="#e8274a" stroke="#e8274a" stroke-width="0"><rect x="-13" y="2" width="6" height="12" rx="1.5"/><rect x="-3" y="-6" width="6" height="20" rx="1.5"/><rect x="7" y="-13" width="6" height="27" rx="1.5"/></g>
    <text x="84" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18141f">Reports</text>
    <text x="32" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">Artist counts, last upload, history,</text><text x="32" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">and what MusicBrainz couldn't match.</text>
  </g><g>
    <rect x="288" y="172" width="264" height="142" rx="14" fill="#ffffff" stroke="#e4dee6"/>
    <rect x="288" y="172" width="264" height="3" rx="1.5" fill="#c77700" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="6.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="326" cy="214" r="22" fill="#c77700" opacity="0.13"/>
    <g transform="translate(326 214)" fill="#c77700" stroke="#c77700" stroke-width="0"><circle cx="-3" cy="-3" r="9" fill="none" stroke-width="3"/><path d="M 4 4 L 12 12" stroke-width="3.4" stroke-linecap="round"/></g>
    <text x="360" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18141f">Forgiving matching</text>
    <text x="308" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">Ne‐Yo, D’Angelo, Ke$ha,</text><text x="308" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">A &amp; B, feat. credits.</text>
  </g><g>
    <rect x="564" y="172" width="264" height="142" rx="14" fill="#ffffff" stroke="#e4dee6"/>
    <rect x="564" y="172" width="264" height="3" rx="1.5" fill="#0b9f5b" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="7.0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="602" cy="214" r="22" fill="#0b9f5b" opacity="0.13"/>
    <g transform="translate(602 214)" fill="#0b9f5b" stroke="#0b9f5b" stroke-width="0"><path d="M 0 -14 L 13 -7 L 0 0 L -13 -7 Z"/><path d="M -13 -4 L -2 2 V 15 L -13 9 Z" opacity="0.7"/><path d="M 13 -4 L 2 2 V 15 L 13 9 Z" opacity="0.45"/></g>
    <text x="636" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#18141f">Tiny</text>
    <text x="584" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">One Python file, stdlib only.</text><text x="584" y="289" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5e5869">~75 MB, amd64 and arm64.</text>
  </g>
</svg>
